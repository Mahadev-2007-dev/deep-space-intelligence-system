# ============================================================
# DSIS - Deep Space Intelligence System
# Render.com Deployment Configuration
# Single service: Spring Boot serves React SPA + REST API
# Public URL: https://dsis-deep-space-intelligence-system.onrender.com
# ============================================================
services:
  - type: web
    name: dsis-deep-space-intelligence-system
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Health check path - Render monitors this endpoint
    healthCheckPath: /api/v1/health
    envVars:
      # Port - Render injects $PORT automatically
      - key: PORT
        value: 10000
      # SQLite database path on the persistent disk
      - key: SQLITE_DB_PATH
        value: /data/dsis.db
      # CORS: single-URL deployment - same origin, CORS header still set for browser preflight
      - key: CORS_ALLOWED_ORIGINS
        value: https://dsis-deep-space-intelligence-system.onrender.com
      # JWT secret - override this in Render dashboard for security
      - key: DSIS_JWT_SECRET
        generateValue: true
    # Persistent disk for SQLite database
    disk:
      name: dsis-sqlite-data
      mountPath: /data
      sizeGB: 1
