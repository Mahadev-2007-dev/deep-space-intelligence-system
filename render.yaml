# ============================================================
# DSIS - Deep Space Intelligence System
# Render.com deployment configuration
# ============================================================
services:
  - type: web
    name: dsis-deep-space-intelligence-system
    env: docker
    region: oregon  # or singapore, frankfurt
    plan: free  # upgrade to starter for no sleep
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SQLITE_DB_PATH
        value: /data/dsis.db
      - key: CORS_ALLOWED_ORIGINS
        value: https://dsis-deep-space-intelligence-system.onrender.com
    disk:
      name: dsis-data
      mountPath: /data
      sizeGB: 1
