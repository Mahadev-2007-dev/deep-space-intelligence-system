# Railway deployment configuration for DSIS
# https://docs.railway.app/reference/config-as-code

[build]
# Use the Dockerfile in the backend directory
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Start command (overrides Dockerfile CMD if needed)
startCommand = "java -Djava.security.egd=file:/dev/./urandom -Xmx512m -Xms256m -jar app.jar"
# Health check path
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
# Restart on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
# Persistent volume for SQLite database
mountPath = "/data"
