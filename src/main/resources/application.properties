server.address=0.0.0.0
server.port=${PORT:8080}

spring.application.name=dsis-backend

# SQLite JPA Configuration
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:data/dsis.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration for Space Object Scanner
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration (use env var in production)
dsis.jwt.secret=${DSIS_JWT_SECRET:9a3f2c5e7b1a4d6f8e0c2b4a6d8f1e3a5c7b9d1f3e5a7b9c1d3e5f7a9b1c3d5e}
dsis.jwt.expiration-ms=86400000

# CORS settings (single-URL deployment: same origin, no CORS issues)
dsis.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.deepspace=INFO
logging.level.root=WARN
